name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Android Debug APK
        working-directory: mobile
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp mobile/app/build/outputs/apk/debug/app-debug.apk release-assets/TxTeller-v1.0.0.apk
          echo "APK generated successfully:"
          ls -lh release-assets/TxTeller-v1.0.0.apk

      - name: Upload APK Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: TxTeller-APK
          path: release-assets/TxTeller-v1.0.0.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: TxTeller v1.0.0 (Bank Shahr SMS Tracker)
          body: |
            ### 📱 TxTeller Android APK Release (v1.0.0)

            این فایل نصبی اختصاصی برای نصب مستقیم (Sideload) بر روی گوشی‌های اندروید آماده شده است.

            #### ✨ قابلیت‌ها در این نسخه:
            * شنود خودکار پیامک‌های بانک شهر با فیلتر محلی و مسدودسازی ۱۰۰٪ قطعی رمز پویا (OTP).
            * صف آفلاین SQLite/Room جهت جلوگیری از گم‌شدن پیامک‌ها در زمان قطعی اینترنت.
            * همگام‌سازی پس‌زمینه با WorkManager و سیاست تکرار تصاعدی.
            * رابط کاربری مدرن با Jetpack Compose (پالت زمردی Emerald Green) و آیکون رسمی برنامه.
            * تست اتصال به سرور و رفع محدودیت باتری (Unrestricted Mode).

            #### 📥 راهنمای نصب:
            1. فایل `TxTeller-v1.0.0.apk` را دانلود کنید.
            2. روی فایل در گوشی کلیک کرده و گزینه **Install** را بزنید.
            3. در اولین اجرا، مجوز خواندن پیامک (`RECEIVE_SMS`) را تایید کنید.
            4. در بخش تنظیمات، آدرس سرور و API Key خود را وارد کنید.
          files: release-assets/TxTeller-v1.0.0.apk
          draft: false
          prerelease: false
